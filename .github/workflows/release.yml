name: Release

on:
  push:
    tags:
      - "v*"

# Write is needed to create releases and release assets because
# GitHub counts them as part of the repo's contents
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # We need to checkout with the full history of every branch and tag
          # because the BigWigsMods packager needs the previous and current tags
          # to generate a changelog. The default value of 1 would be a shallow
          # checkout that only includes the current tag
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
